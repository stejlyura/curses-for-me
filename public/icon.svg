<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="dsTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="dsMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="dsBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect width="512" height="512" rx="116" fill="url(#dsBg)" />
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#3f3f46" stroke-opacity="0.45" stroke-width="6" />

  <!-- Subtle radial aura -->
  <circle cx="256" cy="240" r="170" fill="#6366f1" opacity="0.1" />

  <!-- Top Dataset Layer (Active Highlight + Sync Node) -->
  <rect x="104" y="116" width="224" height="68" rx="22" fill="url(#dsTop)" />
  <circle cx="380" cy="150" r="34" fill="#10b981" />
  <circle cx="380" cy="150" r="14" fill="#ecfdf5" />

  <!-- Middle Dataset Layer (Structured Columns) -->
  <rect x="104" y="222" width="304" height="68" rx="22" fill="url(#dsMid)" />
  <rect x="132" y="246" width="92" height="20" rx="10" fill="#09090b" opacity="0.32" />
  <rect x="240" y="246" width="140" height="20" rx="10" fill="#e0e7ff" opacity="0.45" />

  <!-- Bottom Dataset Layer -->
  <rect x="104" y="328" width="304" height="68" rx="22" fill="url(#dsBot)" />
  <rect x="132" y="352" width="156" height="20" rx="10" fill="#c7d2fe" opacity="0.35" />
  <rect x="304" y="352" width="76" height="20" rx="10" fill="#09090b" opacity="0.35" />
</svg>
