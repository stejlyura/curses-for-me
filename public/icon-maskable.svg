<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="mPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="mGrowthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Ambient Glow in safe area -->
  <circle cx="256" cy="256" r="140" fill="url(#mPrimaryGrad)" opacity="0.15" filter="url(#mGlow)" />

  <!-- Scale-adjusted Group positioned inside 80% safe zone (center 256,256) -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)">
    <!-- Stylized Geometric "M" for Marketolog -->
    <path 
      d="M 124 380 L 124 180 L 210 286 L 256 230 L 302 286 L 388 180 L 388 380" 
      stroke="url(#mPrimaryGrad)" 
      stroke-width="38" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />

    <!-- Ascending Growth / Target Trajectory Arrow -->
    <path 
      d="M 230 380 L 320 280 L 400 170" 
      stroke="url(#mGrowthGrad)" 
      stroke-width="28" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />
    <!-- Arrow Head -->
    <path 
      d="M 334 164 L 404 166 L 406 236" 
      stroke="url(#mGrowthGrad)" 
      stroke-width="28" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />

    <!-- Indicator Pulse Dots -->
    <circle cx="404" cy="166" r="16" fill="#10b981" filter="url(#mGlow)" />
    <circle cx="404" cy="166" r="8" fill="#ecfdf5" />
  </g>
</svg>

